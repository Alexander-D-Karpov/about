<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plugin Admin Dashboard</title>
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        .image-preview { max-width: 96px; max-height: 96px; object-fit: contain; background: transparent; border: 1px solid var(--edge-1); border-radius: 8px; padding: 6px; }
        .image-preview--icon { max-width: 40px; max-height: 40px; border: none; padding: 0; }
        .image-field-container { display: flex; flex-direction: column; gap: 8px; }
        .current-image-preview { display: flex; align-items: center; gap: 12px; padding: 8px; border: 1px solid var(--edge-1); border-radius: 8px; margin-bottom: 8px; }
        .upload-progress { display: none; padding: 8px; background: var(--bg-3); border-radius: 6px; margin-top: 8px; color: var(--accent); }
        .field-with-upload { display: flex; align-items: center; gap: 8px; }
        .field-with-upload .field-input { flex: 1; }
    </style>
</head>
<body>
<div class="header">
    <div class="header-inner">
        <h1>Plugin Admin</h1>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="saveAllPlugins()">Save All</button>
            <button class="btn btn-secondary" onclick="previewSite()">Preview</button>
            <button class="btn btn-secondary" onclick="reloadConfig()">Reload Config</button>
            <button class="btn btn-secondary" onclick="window.location.href='/admin/projects'">Projects</button>
        </div>
    </div>
</div>
<div class="container">
    <div class="controls">
        <div class="controls-left">
            <button class="btn btn-secondary btn-sm" onclick="setAllCollapsed(false)">Expand all</button>
            <button class="btn btn-secondary btn-sm" onclick="setAllCollapsed(true)">Collapse all</button>
        </div>
        <div class="controls-right">
            <input type="text" class="search-input" placeholder="Search plugins..." id="plugin-search">
        </div>
    </div>

    <div id="plugins-container" class="plugins-grid">
        {{range .Plugins}}
        <div class="plugin collapsed" data-plugin="{{.Name}}" data-order="{{.Order}}" data-plugin-id="plugin-{{.Name}}">
            <div class="plugin-header">
                <button type="button" class="plugin-expand-btn" aria-label="Toggle">▸</button>
                <div class="plugin-info">
                    <div class="plugin-title">{{.Name}}</div>
                    <div class="plugin-description">{{.Description}}</div>
                </div>
                <div class="plugin-controls">
                    <div class="order-control">
                        <label class="order-label">Order</label>
                        <input type="number" name="order" value="{{.Order}}" class="order-input" min="0" max="100">
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" class="plugin-toggle" data-plugin="{{.Name}}" {{if .Enabled}}checked{{end}}>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <form class="plugin-form" data-plugin="{{.Name}}" id="form-{{.Name}}">
                <div class="form-section">
                    <div id="settings-{{.Name}}" class="settings-editor" data-settings='{{.Settings | jsonPretty}}'></div>
                </div>
                <div class="actions">
                    <button type="submit" class="btn btn-primary">Save Plugin</button>
                    <button type="button" class="btn btn-secondary" onclick="reloadPlugin('{{.Name}}')">Reload</button>
                </div>
            </form>
        </div>
        {{end}}
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="/static/js/admin.js?v={{.Config.AdminUser}}"></script>
<script>
    const pluginsData = {};
    {{range $plugin := .Plugins}}
    try {
        const container = document.getElementById('settings-{{$plugin.Name}}');
        if (container && container.dataset.settings) {
            pluginsData["{{$plugin.Name}}"] = JSON.parse(container.dataset.settings);
        }
    } catch (e) {
        console.error('Failed to load settings for {{$plugin.Name}}:', e);
        pluginsData["{{$plugin.Name}}"] = {};
    }
    {{end}}

    function setAllCollapsed(collapsed) {
        document.querySelectorAll('#plugins-container .plugin').forEach(p => p.classList.toggle('collapsed', collapsed));
    }

    document.addEventListener('DOMContentLoaded', function () {
        {{range $plugin := .Plugins}}
        try {
            initSettingsEditor('{{$plugin.Name}}', pluginsData['{{$plugin.Name}}'] || {});
        } catch (e) {
            console.error('Error initializing {{$plugin.Name}}:', e);
        }
        {{end}}
        initSortable();
        initSearch();

        document.querySelectorAll('#plugins-container .plugin').forEach(plugin => {
            const toggle = () => plugin.classList.toggle('collapsed');
            plugin.querySelector('.plugin-expand-btn')?.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggle();
            });
            plugin.querySelector('.plugin-info')?.addEventListener('click', toggle);
        });

        const search = document.getElementById('plugin-search');
        if (search) {
            search.addEventListener('input', () => {
                if (search.value.trim()) setAllCollapsed(false);
            });
        }
    });
</script>
</body>
</html>
