<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .Title }}</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
:root{
  --bg:#0a0a0b; --panel:#141519; --panel-2:#191b20; --row:#16181d; --row-hover:#1c1f26;
  --fg:#e8eaed; --fg-2:#9aa0a6; --fg-3:#6e737a;
  --steam:#66c0f4; --steam-dim:#417a9b; --green:#5ba32b; --gold:#ffc83d; --purple:#a371f7;
  --edge:rgba(255,255,255,.07);
  --mono:ui-monospace,"JetBrains Mono","SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:26px 18px 80px}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.back{font-size:12px;color:var(--fg-2);text-decoration:none;border:1px solid var(--edge);border-radius:4px;padding:6px 12px}
.back:hover{color:var(--fg);background:var(--panel-2)}
h1{font-size:clamp(20px,3vw,28px);margin:0;font-weight:600;letter-spacing:-.01em}
h1 span{color:var(--steam)}

/* Steam-style stat block */
.stats{display:flex;flex-wrap:wrap;background:var(--panel);border-radius:4px;padding:18px 8px;margin-bottom:22px}
.stat{flex:1 1 150px;padding:4px 16px;min-width:0}
.stat-v{font-size:clamp(20px,2.6vw,28px);font-weight:300;letter-spacing:-.01em;line-height:1.15;font-variant-numeric:tabular-nums}
.stat-l{font-size:13px;color:var(--fg-3);margin-top:3px}

/* now playing */
.now{display:flex;gap:14px;align-items:center;padding:12px;margin-bottom:22px;background:var(--panel);border-left:3px solid var(--green);border-radius:4px}
.now img{width:120px;height:56px;object-fit:cover;border-radius:2px;flex-shrink:0}
.now-l{font-size:11px;color:var(--green);text-transform:uppercase;letter-spacing:.08em}
.now-n{font-size:16px;font-weight:600;margin-top:1px}

/* sections */
.sec{margin-bottom:24px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--fg-2)}
.sec-h::after{content:"";flex:1;height:1px;background:var(--edge)}
.sec-note{font-size:10px;color:var(--fg-3);text-transform:none;letter-spacing:.02em}

/* top this year */
.year-list{display:flex;flex-direction:column;gap:8px}
.year-row{display:flex;align-items:center;gap:12px}
.year-name{flex:0 0 auto;width:min(220px,36vw);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.year-bar{flex:1;height:6px;background:var(--panel-2);border-radius:2px;overflow:hidden}
.year-fill{height:100%;background:var(--steam);border-radius:2px}
.year-v{flex:0 0 auto;width:120px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.year-v b{font-size:13px;font-weight:600}
.year-v s{font-size:10px;color:var(--fg-3);text-decoration:none;margin-left:6px}

/* controls */
.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;min-width:0;background:var(--panel-2);border:1px solid var(--edge);color:var(--fg);padding:8px 12px;border-radius:3px;font-family:var(--sans);font-size:13px}
.search:focus{outline:2px solid var(--steam-dim);outline-offset:0}
select.sort{background:var(--panel-2);border:1px solid var(--edge);color:var(--fg);padding:8px 10px;border-radius:3px;font-size:13px;font-family:var(--sans);cursor:pointer}
select.sort:focus{outline:2px solid var(--steam-dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--edge);color:var(--fg-2);padding:7px 13px;border-radius:3px;font-size:12px;cursor:pointer;font-family:var(--sans)}
.chip:hover{color:var(--fg);background:var(--panel-2)}
.chip[aria-pressed="true"]{background:var(--steam-dim);border-color:var(--steam-dim);color:#fff}
.chip:focus-visible,.back:focus-visible{outline:2px solid var(--steam);outline-offset:2px}

/* ---- Steam-style rows ---- */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:18px;padding:14px;background:var(--row);border-radius:4px;align-items:flex-start}
.row:hover{background:var(--row-hover)}
.art{flex:0 0 320px;width:320px;aspect-ratio:231/107;background:var(--panel-2);border-radius:2px;overflow:hidden;display:block;position:relative}
.art img{width:100%;height:100%;object-fit:cover;display:block}
/* the tiny library icon is the last resort: contain it instead of stretching it */
.art img.icon-only{object-fit:contain;padding:22px;image-rendering:auto}
.art .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600;color:var(--fg-3)}
.body{flex:1;min-width:0}
.name{font-size:18px;font-weight:600;line-height:1.25;margin-bottom:9px}
.name a{text-decoration:none}
.name a:hover{color:var(--steam)}
.tag{font-size:10px;padding:1px 6px;border-radius:2px;background:rgba(163,113,247,.18);color:var(--purple);margin-left:7px;vertical-align:middle}

.cols{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.col{min-width:0}
/* keep the meta columns from stretching when the achievement column is tall */
.col:not(.col-ach){flex:0 0 auto}
.col-l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3);margin-bottom:3px;white-space:nowrap}
.col-v{font-size:14px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.col-ach{flex:1 1 260px;min-width:230px}
.ach-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ach-n{font-size:13px;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--fg-2)}
.ach-bar{height:8px;background:var(--panel-2);border-radius:2px;overflow:hidden;margin-top:5px}
.ach-fill{height:100%;background:var(--steam);border-radius:2px}
.ach-none{font-size:12px;color:var(--fg-3)}

/* rarest achievements, per game, under the bar */
.rare{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.rare-i{display:flex;align-items:center;gap:6px;background:var(--panel-2);border-radius:3px;padding:4px 8px 4px 4px;max-width:100%}
.rare-i img{width:26px;height:26px;border-radius:2px;flex-shrink:0;background:var(--panel)}
.rare-i .ph{width:26px;height:26px;border-radius:2px;flex-shrink:0;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--fg-3)}
.rare-n{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.rare-p{font-size:11.5px;font-family:var(--mono);font-variant-numeric:tabular-nums;flex-shrink:0}

.row{transition:background .12s ease}

/* hovering a badge enlarges it and reveals the description in a real tooltip */
.rare-i{position:relative;transition:transform .12s ease,background .12s ease;cursor:default}
.rare-i:hover{transform:scale(1.06);background:#22262e;z-index:5}
.rare-i:hover img,.rare-i:hover .ph{width:34px;height:34px}
.rare-i img,.rare-i .ph{transition:width .12s ease,height .12s ease}
.tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);
  width:max-content;max-width:280px;padding:9px 11px;border-radius:5px;
  background:#0c0d10;border:1px solid var(--edge);box-shadow:0 8px 22px rgba(0,0,0,.6);
  opacity:0;visibility:hidden;transition:opacity .12s ease,transform .12s ease;
  pointer-events:none;z-index:40;text-align:left;white-space:normal;
}
.rare-i:hover .tip{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
/* block, or the three lines run together inside the inline badge */
.tip-n{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--fg);line-height:1.3}
.tip-d{display:block;font-size:12px;color:var(--fg-2);line-height:1.45}
.tip-p{display:block;font-size:11px;font-family:var(--mono);margin-top:6px}
.btn{display:inline-block;font-size:12px;padding:6px 12px;border-radius:3px;border:1px solid var(--edge);color:var(--fg-2);background:transparent;text-decoration:none;cursor:pointer;font-family:var(--sans)}
.btn:hover{background:var(--panel-2);color:var(--fg)}
.btn:focus-visible{outline:2px solid var(--steam);outline-offset:2px}

.msg{padding:40px 20px;text-align:center;color:var(--fg-3);font-size:13px}
.spinner{width:18px;height:18px;margin:22px auto;border:2px solid var(--edge);border-top-color:var(--steam);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hide{display:none !important}
.sentinel{height:1px}

@media (max-width:720px){
  .wrap{padding:18px 12px 60px}
  .row{flex-direction:column;gap:11px}
  .art{flex:0 0 auto;width:100%;aspect-ratio:460/215}
  .art img.icon-only{padding:30px}
  .stat{flex:1 1 50%}
  .year-name{width:40vw}
  .year-v{width:100px}
  .cols{gap:18px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <a class="back" href="/">&larr; back</a>
  </div>

  <div class="stats" id="stats"></div>
  <div id="now"></div>

  <section class="sec hide" id="year-sec">
    <div class="sec-h">Most played <span id="year-label"></span> <span class="sec-note" id="year-note"></span></div>
    <div class="year-list" id="year"></div>
  </section>

  <section class="sec">
    <div class="controls">
      <input class="search" id="q" type="search" placeholder="Find a game" aria-label="Find a game">
      <select class="sort" id="sort" aria-label="Sort by">
        <option value="playtime">Most played</option>
        <option value="recent">Recently played</option>
        <option value="year">Most played this year</option>
        <option value="added">Recently added</option>
        <option value="ach">Achievement completion</option>
      </select>
      <div class="chips" id="chips">
        <button class="chip" data-f="all" aria-pressed="true">All</button>
        <button class="chip" data-f="played" aria-pressed="false">Played</button>
        <button class="chip" data-f="unplayed" aria-pressed="false">Unplayed</button>
      </div>
    </div>

    <div class="list" id="list"></div>
    <div class="spinner hide" id="spin"></div>
    <div class="msg hide" id="msg"></div>
    <div class="sentinel" id="sentinel"></div>
  </section>

</div>

<script>
(function(){
  "use strict";

  var PAGE = 30;
  var state = {offset:0, q:"", sort:"playtime", filter:"all", loading:false, hasMore:true, seeded:false};

  var list = document.getElementById("list");
  var spin = document.getElementById("spin");
  var msg  = document.getElementById("msg");

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function hours(mins){
    var v=(mins||0)/60;
    if(v>=100) return Math.round(v).toLocaleString();
    if(v>0) return v.toFixed(1);
    return "0";
  }
  function when(ts){
    if(!ts) return "never";
    return new Date(ts*1000).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  }
  function monthYear(ts){
    if(!ts) return "unknown";
    return new Date(ts*1000).toLocaleDateString(undefined,{month:"short",year:"numeric"});
  }
  function rarityColor(p){
    if(p<1) return "var(--gold)";
    if(p<5) return "var(--purple)";
    if(p<15) return "var(--steam)";
    return "var(--fg-3)";
  }

  // Walk the banner fallbacks; the library icon is contained rather than stretched, and a real
  // placeholder is used if nothing resolves, so a row never shows a blurry or empty box.
  function attachArt(box, g){
    var srcs = [g.img].concat(g.imgFallbacks||[]);
    if(g.iconUrl) srcs.push(g.iconUrl);
    var i = 0;
    var img = document.createElement("img");
    img.alt = g.name;
    img.loading = "lazy";
    img.decoding = "async";
    img.addEventListener("error", function(){
      i++;
      if(i < srcs.length){
        img.src = srcs[i];
        img.classList.toggle("icon-only", g.iconUrl && srcs[i] === g.iconUrl);
        return;
      }
      box.innerHTML = '<div class="ph">'+esc((g.name||"?").charAt(0).toUpperCase())+'</div>';
    });
    img.src = srcs[0];
    box.appendChild(img);
  }

  // A handful of games (Factorio among them) reference achievement art Steam no longer serves,
  // so try the grey variant before settling on a placeholder rather than showing a broken box.
  function achIconChain(a){
    var out = [];
    if(a.icon) out.push(a.icon);
    if(a.iconGray && a.iconGray !== a.icon) out.push(a.iconGray);
    return out;
  }

  function bindIconFallback(img, srcs){
    var i = 0;
    img.addEventListener("error", function(){
      i++;
      if(i < srcs.length){ img.src = srcs[i]; return; }
      var ph = document.createElement("div");
      ph.className = "ph";
      ph.textContent = "★";
      img.replaceWith(ph);
    });
    img.src = srcs[0];
  }

  function rarestHTML(rarest){
    if(!rarest || !rarest.length) return "";
    return '<div class="rare">'+rarest.map(function(a){
      var srcs = achIconChain(a);
      var ic = srcs.length
        ? '<img alt="" loading="lazy" data-srcs="'+esc(JSON.stringify(srcs))+'">'
        : '<div class="ph">&#9733;</div>';
      var colour = rarityColor(a.globalPercent);
      return '<span class="rare-i">'+
        ic+
        '<span class="rare-n">'+esc(a.name)+'</span>'+
        '<span class="rare-p" style="color:'+colour+'">'+a.globalPercent.toFixed(1)+'%</span>'+
        '<span class="tip">'+
          '<span class="tip-n">'+esc(a.name)+'</span>'+
          (a.description ? '<span class="tip-d">'+esc(a.description)+'</span>' : '<span class="tip-d">No description.</span>')+
          '<span class="tip-p" style="color:'+colour+'">'+a.globalPercent.toFixed(1)+'% of players unlocked this</span>'+
        '</span>'+
      '</span>';
    }).join("")+'</div>';
  }

  // Wire up the icon chains after the markup lands.
  function hydrateIcons(scope){
    scope.querySelectorAll("img[data-srcs]").forEach(function(img){
      var srcs;
      try { srcs = JSON.parse(img.dataset.srcs); } catch(e){ return; }
      img.removeAttribute("data-srcs");
      bindIconFallback(img, srcs);
    });
  }

  function achBlockHTML(achieved, total, percent, rarest){
    return '<div class="ach-head"><div class="col-l">Achievements</div>'+
             '<span class="ach-n">'+achieved+' / '+total+'</span></div>'+
           '<div class="ach-bar"><div class="ach-fill" style="width:'+percent.toFixed(1)+'%"></div></div>'+
           rarestHTML(rarest);
  }

  // Games without achievements drop the column entirely rather than showing an empty "none".
  function achHTML(g){
    if(!g.hasStats) return "";
    if(!g.achLoaded) return '<div class="col-l">Achievements</div><div class="ach-none">loading…</div>';
    if(!g.achTotal)  return "";
    return achBlockHTML(g.achAchieved, g.achTotal, g.achPercent, g.rarest);
  }

  function row(g){
    var el = document.createElement("article");
    el.className = "row";
    el.dataset.appid = g.appid;

    // Surface the figure the current sort is about, so the ordering is always explainable.
    var extra = "";
    if(state.sort === "recent"){
      extra = '<div class="col"><div class="col-l">Last 2 weeks</div>'+
              '<div class="col-v">'+hours(g.playtime2w)+' hours</div></div>';
    } else if(state.sort === "year"){
      extra = '<div class="col"><div class="col-l">This year</div>'+
              '<div class="col-v">'+hours(g.playtimeYear)+' hours</div></div>';
    } else if(g.playtimeYear){
      extra = '<div class="col"><div class="col-l">This year</div>'+
              '<div class="col-v">'+hours(g.playtimeYear)+' hours</div></div>';
    }

    var ach = achHTML(g);

    el.innerHTML =
      '<a class="art" href="'+esc(g.storeUrl)+'" target="_blank" rel="noopener" aria-label="'+esc(g.name)+' on Steam"></a>'+
      '<div class="body">'+
        '<div class="name"><a href="'+esc(g.storeUrl)+'" target="_blank" rel="noopener">'+esc(g.name)+'</a>'+
          (g.source==="family" ? '<span class="tag">family</span>' : '')+
        '</div>'+
        '<div class="cols">'+
          '<div class="col"><div class="col-l">Total played</div><div class="col-v">'+hours(g.playtimeForever)+' hours</div></div>'+
          '<div class="col"><div class="col-l">Last played</div><div class="col-v">'+when(g.lastPlayed)+'</div></div>'+
          '<div class="col"><div class="col-l">'+(g.addedIsFirstSeen?"In library since":"Added")+'</div>'+
            '<div class="col-v">'+(g.addedIsFirstSeen ? monthYear(g.addedAt) : when(g.addedAt))+'</div></div>'+
          extra+
          (ach ? '<div class="col col-ach js-ach">'+ach+'</div>' : '')+
        '</div>'+
      '</div>';

    attachArt(el.querySelector(".art"), g);
    hydrateIcons(el);

    // Rows whose achievements are not cached yet fill in when they scroll into view, so the
    // visible part of the list resolves first instead of waiting on the whole library.
    if(g.hasStats && !g.achLoaded) achQueue.observe(el);
    return el;
  }

  var achQueue = (function(){
    var io = ("IntersectionObserver" in window) ? new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(!e.isIntersecting) return;
        io.unobserve(e.target);
        fetchAch(e.target);
      });
    }, {rootMargin:"200px"}) : null;

    function fetchAch(el){
      var id = el.dataset.appid;
      var slot = el.querySelector(".js-ach");
      if(!slot) return;
      fetch("/api/steam/achievements?appid="+id)
        .then(function(r){ return r.json(); })
        .then(function(d){
          // Nothing to show means the column goes away, not an empty "none".
          if(!d.available || !d.total){ slot.remove(); return; }
          slot.innerHTML = achBlockHTML(d.achieved, d.total, d.percent, d.rarest);
          hydrateIcons(slot);
        })
        .catch(function(){ slot.remove(); });
    }

    return {
      observe: function(el){ if(io) io.observe(el); else fetchAch(el); }
    };
  })();

  function renderStats(s){
    if(state.seeded) return;
    state.seeded = true;

    var achLabel = s.pendingEnrichment > 0
      ? "achievements · scanning " + s.gamesEnriched + " of " + (s.gamesEnriched + s.pendingEnrichment)
      : "achievements";

    var tiles = [
      [s.totalGames.toLocaleString(), "games"],
      [Math.round(s.totalPlaytimeHours).toLocaleString(), "hours played"],
      [s.playedGames.toLocaleString(), "played"],
      [s.achievementsUnlocked.toLocaleString() + ' <span style="font-size:.55em;color:var(--fg-3)">/ ' + s.achievementsTotal.toLocaleString() + '</span>', achLabel],
      [s.perfectGames.toLocaleString(), "100% complete"]
    ];
    document.getElementById("stats").innerHTML = tiles.map(function(t){
      return '<div class="stat"><div class="stat-v">'+t[0]+'</div><div class="stat-l">'+t[1]+'</div></div>';
    }).join("");

    var c = s.current || {};
    if(c.playing){
      document.getElementById("now").innerHTML =
        '<div class="now">'+(c.gameImage ? '<img src="'+esc(c.gameImage)+'" alt="">' : '')+
        '<div><div class="now-l">Now playing</div><div class="now-n">'+esc(c.gameName)+'</div></div></div>';
    }

    var yr = s.topThisYear || [];
    if(yr.length){
      document.getElementById("year-sec").classList.remove("hide");
      document.getElementById("year-label").textContent = "in " + s.year;
      if(s.yearSnapshotAt){
        document.getElementById("year-note").textContent =
          "tracked since " + new Date(s.yearSnapshotAt*1000).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
      }
      var top = yr[0].minutes || 1;
      document.getElementById("year").innerHTML = yr.map(function(g){
        return '<div class="year-row">'+
          '<div class="year-name">'+esc(g.name)+'</div>'+
          '<div class="year-bar"><div class="year-fill" style="width:'+((g.minutes/top)*100).toFixed(1)+'%"></div></div>'+
          '<div class="year-v"><b>'+hours(g.minutes)+' h</b><s>'+hours(g.totalMinutes)+' h total</s></div>'+
        '</div>';
      }).join("");
    }
  }

  function load(){
    if(state.loading || !state.hasMore) return;
    state.loading = true;
    spin.classList.remove("hide");
    msg.classList.add("hide");

    var url = "/api/steam/games?offset="+state.offset+"&limit="+PAGE+
              "&sort="+encodeURIComponent(state.sort)+
              "&filter="+encodeURIComponent(state.filter)+
              "&q="+encodeURIComponent(state.q);

    fetch(url).then(function(r){ return r.json(); }).then(function(d){
      if(d.stats) renderStats(d.stats);

      var frag = document.createDocumentFragment();
      d.games.forEach(function(g){ frag.appendChild(row(g)); });
      list.appendChild(frag);

      state.offset += d.games.length;
      state.hasMore = d.hasMore;
      state.loading = false;
      spin.classList.add("hide");

      if(state.offset === 0){
        msg.textContent = state.q ? "No games match that search." : "No games in the library yet.";
        msg.classList.remove("hide");
      }
    }).catch(function(){
      state.loading = false;
      state.hasMore = false;
      spin.classList.add("hide");
      msg.textContent = "Couldn't load the library. Reload to try again.";
      msg.classList.remove("hide");
    });
  }

  function reset(){
    state.offset = 0; state.hasMore = true;
    list.innerHTML = "";
    load();
  }

  var t;
  document.getElementById("q").addEventListener("input", function(e){
    clearTimeout(t);
    var v = e.target.value;
    t = setTimeout(function(){ state.q = v; reset(); }, 240);
  });
  document.getElementById("sort").addEventListener("change", function(e){
    state.sort = e.target.value; reset();
  });
  document.getElementById("chips").addEventListener("click", function(e){
    var b = e.target.closest(".chip");
    if(!b) return;
    Array.prototype.forEach.call(this.querySelectorAll(".chip"), function(c){ c.setAttribute("aria-pressed","false"); });
    b.setAttribute("aria-pressed","true");
    state.filter = b.dataset.f;
    reset();
  });

  if("IntersectionObserver" in window){
    new IntersectionObserver(function(es){ if(es[0].isIntersecting) load(); }, {rootMargin:"500px"})
      .observe(document.getElementById("sentinel"));
  } else {
    window.addEventListener("scroll", function(){
      if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) load();
    });
  }

  load();
})();
</script>
</body>
</html>
