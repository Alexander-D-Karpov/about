<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Projects</title>
    <style>
        :root {
            --bg: #05070a;
            --bg-2: #080b10;
            --bg-3: #0b0f14;
            --paper: #070b10;
            --ink: #e6edf3;
            --ink-2: #c5ccd4;
            --muted: #8a94a2;
            --accent: #7aa2ff;
            --good: #3ad38b;
            --bad: #ff6b6b;
            --warn: #ffd166;
            --border: rgba(255,255,255,.06);
            --border-2: rgba(255,255,255,.1);
            --shadow: 0 10px 30px rgba(0,0,0,.55);
            --radius: 12px;
            --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Roboto, sans-serif;
            --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font); background: var(--bg); color: var(--ink); min-height: 100vh; }

        .topbar {
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 24px;
            background: var(--bg-2); border-bottom: 1px solid var(--border);
        }
        .topbar-left { display: flex; align-items: center; gap: 16px; }
        .topbar h1 { font-size: 20px; font-weight: 700; color: var(--accent); }
        .back-link {
            color: var(--muted); text-decoration: none; font-size: 13px;
            display: flex; align-items: center; gap: 4px;
        }
        .back-link:hover { color: var(--accent); }
        .topbar-right { display: flex; gap: 10px; }

        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius);
            background: var(--paper); color: var(--ink); font-size: 13px; font-weight: 500;
            cursor: pointer; white-space: nowrap;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
        .btn-primary:hover { background: #5b8ef0; color: #fff; }
        .btn-danger { background: var(--bad); border-color: var(--bad); color: #fff; }
        .btn-danger:hover { background: #e04040; color: #fff; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .btn-ghost { background: none; border: none; color: var(--muted); padding: 6px; }
        .btn-ghost:hover { color: var(--ink); }

        .container { max-width: 1100px; margin: 0 auto; padding: 24px; }

        .project-list { display: flex; flex-direction: column; gap: 2px; }

        .project-card {
            display: grid;
            grid-template-columns: 32px 120px 1fr auto;
            gap: 16px; align-items: start;
            padding: 16px; background: var(--paper);
            border: 1px solid var(--border); border-radius: var(--radius);
            transition: border-color .15s;
        }
        .project-card:hover { border-color: var(--border-2); }
        .project-card.dragging { opacity: .4; }
        .project-card.sortable-ghost { opacity: .25; border: 2px dashed var(--accent); }

        .drag-handle {
            cursor: grab; color: var(--muted); display: flex; align-items: center;
            justify-content: center; padding-top: 4px; user-select: none;
        }
        .drag-handle:active { cursor: grabbing; }
        .drag-handle svg { width: 18px; height: 18px; }

        .project-thumb {
            width: 120px; height: 80px; border-radius: 8px; overflow: hidden;
            background: var(--bg-3); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            position: relative; cursor: pointer;
        }
        .project-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .project-thumb .thumb-placeholder {
            color: var(--muted); font-size: 11px; text-align: center; padding: 8px;
        }
        .project-thumb:hover .thumb-overlay { opacity: 1; }
        .thumb-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,.7);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity .15s; color: #fff; font-size: 11px;
        }

        .project-body { min-width: 0; }
        .project-name-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
        .project-name {
            font-size: 16px; font-weight: 600; color: var(--ink);
            background: none; border: none; padding: 0; width: 100%;
            font-family: var(--font);
        }
        .project-name:focus { outline: none; border-bottom: 1px solid var(--accent); }

        .project-desc {
            width: 100%; background: none; border: none; padding: 0;
            color: var(--ink-2); font-size: 13px; font-family: var(--font);
            resize: none; line-height: 1.4;
        }
        .project-desc:focus { outline: none; border-bottom: 1px solid var(--accent); }

        .project-links-row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
        .link-input-group { display: flex; align-items: center; gap: 4px; }
        .link-label { font-size: 11px; color: var(--muted); font-weight: 600; min-width: 50px; }
        .link-input {
            padding: 4px 8px; background: var(--bg-3); border: 1px solid var(--border);
            border-radius: 6px; color: var(--ink); font-size: 12px; width: 220px;
            font-family: var(--mono);
        }
        .link-input:focus { outline: none; border-color: var(--accent); }

        .tech-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: center; }
        .tech-tag {
            display: inline-flex; align-items: center; gap: 3px;
            padding: 3px 8px; background: var(--bg-3); border: 1px solid var(--border);
            border-radius: 6px; font-size: 11px; color: var(--ink-2); font-weight: 500;
        }
        .tech-tag-remove {
            cursor: pointer; color: var(--muted); font-size: 13px; line-height: 1;
            margin-left: 2px;
        }
        .tech-tag-remove:hover { color: var(--bad); }
        .tech-add-input {
            padding: 3px 8px; background: var(--bg-3); border: 1px dashed var(--border-2);
            border-radius: 6px; font-size: 11px; color: var(--ink); width: 100px;
            font-family: var(--font);
        }
        .tech-add-input:focus { outline: none; border-color: var(--accent); border-style: solid; }
        .tech-add-input::placeholder { color: var(--muted); }

        .project-actions { display: flex; flex-direction: column; gap: 6px; padding-top: 2px; }

        .add-project-area {
            display: flex; align-items: center; justify-content: center;
            padding: 20px; border: 2px dashed var(--border-2); border-radius: var(--radius);
            cursor: pointer; color: var(--muted); font-size: 14px; font-weight: 500;
            transition: border-color .15s, color .15s;
        }
        .add-project-area:hover { border-color: var(--accent); color: var(--accent); }

        .status-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 10px 24px; background: var(--bg-2); border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            font-size: 12px; color: var(--muted); z-index: 100;
        }
        .status-saved { color: var(--good); }
        .status-unsaved { color: var(--warn); }
        .status-saving { color: var(--accent); }

        .upload-input { display: none; }

        .toast {
            position: fixed; top: 16px; right: 16px; padding: 10px 18px;
            border-radius: var(--radius); font-size: 13px; font-weight: 500;
            z-index: 1000; opacity: 0; transform: translateY(-10px);
            transition: opacity .2s, transform .2s;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { background: #1a3a1a; color: var(--good); border: 1px solid #2a4a2a; }
        .toast-error { background: #3a1a1a; color: var(--bad); border: 1px solid #4a2a2a; }

        .empty-state {
            text-align: center; padding: 60px 20px; color: var(--muted);
        }
        .empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: .4; }
        .empty-state p { font-size: 14px; margin-bottom: 16px; }

        @media (max-width: 800px) {
            .project-card { grid-template-columns: 28px 1fr auto; }
            .project-thumb { display: none; }
            .link-input { width: 160px; }
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <a class="back-link" href="/admin">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
            Admin
        </a>
        <h1>Projects</h1>
        <span id="project-count" style="font-size:12px;color:var(--muted)"></span>
    </div>
    <div class="topbar-right">
        <button class="btn" onclick="addProject()">+ Add Project</button>
        <button class="btn btn-primary" id="save-btn" onclick="saveAll()">Save</button>
    </div>
</div>

<div class="container">
    <div class="project-list" id="project-list"></div>
    <div class="add-project-area" onclick="addProject()" style="margin-top:12px">+ Add Project</div>
</div>

<div class="status-bar">
    <span id="status-text" class="status-saved">All saved</span>
    <span id="status-count"></span>
</div>

<div class="toast" id="toast"></div>
<input type="file" class="upload-input" id="global-upload" accept="image/*">
<datalist id="tech-options"></datalist>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script>
    const GRIP_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>';

    let projects = [];
    let techOptions = [];
    let dirty = false;
    let saving = false;
    let uploadTarget = null;

    (function init() {
        // {{.Projects | json}} renders as a JS string literal in this <script>
        // context (html/template auto-escaping), so parse it back into an array.
        const raw = JSON.parse({{.Projects | json}});
        projects = Array.isArray(raw) ? raw.map(normalize) : [];
        const opts = JSON.parse({{.TechOptions | json}});
        techOptions = Array.isArray(opts) ? opts : [];
        render();
        initSortable();
        updateCounts();

        document.getElementById('global-upload').addEventListener('change', handleUpload);
        window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveAll(); }
        });
    })();

    function normalize(p) {
        return {
            name: p.name || '',
            description: p.description || '',
            github: p.github || '',
            live: p.live || '',
            image: p.image || '',
            technologies: Array.isArray(p.technologies) ? p.technologies : [],
            created: p.created || '',
            updated: p.updated || ''
        };
    }

    function render() {
        const list = document.getElementById('project-list');
        list.innerHTML = '';

        if (projects.length === 0) {
            list.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg><p>No projects yet</p></div>';
            return;
        }

        projects.forEach((p, i) => {
            const card = document.createElement('div');
            card.className = 'project-card';
            card.dataset.index = i;
            card.innerHTML = buildCard(p, i);
            list.appendChild(card);
        });

        populateTechOptions();
    }

    // Quick-pick list = techstack plugin's technologies + any already used here.
    function populateTechOptions() {
        const dl = document.getElementById('tech-options');
        if (!dl) return;
        const set = new Set(techOptions);
        projects.forEach(p => (p.technologies || []).forEach(t => set.add(t)));
        dl.innerHTML = [...set].sort((a, b) => a.localeCompare(b))
            .map(t => `<option value="${esc(t)}">`).join('');
    }

    function handleTagPick(e, i) {
        const val = e.target.value.trim();
        if (val && !projects[i].technologies.includes(val)) {
            projects[i].technologies.push(val);
            markDirty();
            render();
            const inp = document.querySelector(`#tags-${i} .tech-add-input`);
            if (inp) inp.focus();
        } else {
            e.target.value = '';
        }
    }

    function buildCard(p, i) {
        const techs = p.technologies.map((t, ti) =>
            `<span class="tech-tag">${esc(t)}<span class="tech-tag-remove" onclick="removeTech(${i},${ti})">×</span></span>`
        ).join('');

        return `
        <div class="drag-handle" title="Drag to reorder">${GRIP_ICON}</div>
        <div class="project-thumb" onclick="triggerUpload(${i})" title="Click to change image">
            ${p.image
            ? `<img src="${esc(p.image)}" alt="">`
            : '<div class="thumb-placeholder">Click to<br>add image</div>'}
            <div class="thumb-overlay">Change</div>
        </div>
        <div class="project-body">
            <input class="project-name" value="${esc(p.name)}" placeholder="Project name"
                   oninput="updateField(${i},'name',this.value)">
            <textarea class="project-desc" rows="2" placeholder="Description..."
                      oninput="autoResize(this); updateField(${i},'description',this.value)">${esc(p.description)}</textarea>
            <div class="project-links-row">
                <div class="link-input-group">
                    <span class="link-label">GitHub</span>
                    <input class="link-input" value="${esc(p.github)}" placeholder="https://github.com/..."
                           oninput="updateField(${i},'github',this.value)">
                </div>
                <div class="link-input-group">
                    <span class="link-label">Live</span>
                    <input class="link-input" value="${esc(p.live)}" placeholder="https://..."
                           oninput="updateField(${i},'live',this.value)">
                </div>
            </div>
            <div class="project-links-row">
                <div class="link-input-group">
                    <span class="link-label">Created</span>
                    <input type="date" class="link-input" style="width:150px" value="${esc(p.created)}"
                           oninput="updateField(${i},'created',this.value)">
                </div>
                <div class="link-input-group">
                    <span class="link-label">Updated</span>
                    <input type="date" class="link-input" style="width:150px" value="${esc(p.updated)}"
                           oninput="updateField(${i},'updated',this.value)">
                </div>
                <span style="font-size:11px;color:var(--muted);align-self:center">dates auto-refresh daily from GitHub; public list is sorted by Updated</span>
            </div>
            <div class="tech-tags" id="tags-${i}">
                ${techs}
                <input class="tech-add-input" placeholder="+ tag" list="tech-options"
                       onkeydown="handleTagKey(event,${i})" onchange="handleTagPick(event,${i})">
            </div>
        </div>
        <div class="project-actions">
            <button class="btn btn-sm btn-ghost" onclick="moveProject(${i},-1)" ${i === 0 ? 'disabled' : ''} title="Move up">↑</button>
            <button class="btn btn-sm btn-ghost" onclick="moveProject(${i},1)" ${i === projects.length-1 ? 'disabled' : ''} title="Move down">↓</button>
            <button class="btn btn-sm btn-ghost" onclick="duplicateProject(${i})" title="Duplicate">⧉</button>
            <button class="btn btn-sm btn-danger" onclick="removeProject(${i})" title="Delete">✕</button>
        </div>
    `;
    }

    function updateField(i, field, value) {
        projects[i][field] = value;
        markDirty();
    }

    function handleTagKey(e, i) {
        if (e.key === 'Enter' || e.key === ',') {
            e.preventDefault();
            const val = e.target.value.trim().replace(/,$/, '');
            if (val && !projects[i].technologies.includes(val)) {
                projects[i].technologies.push(val);
                markDirty();
                render();
                const nextInput = document.querySelector(`#tags-${i} .tech-add-input`);
                if (nextInput) nextInput.focus();
            }
        }
        if (e.key === 'Backspace' && e.target.value === '' && projects[i].technologies.length > 0) {
            projects[i].technologies.pop();
            markDirty();
            render();
            const nextInput = document.querySelector(`#tags-${i} .tech-add-input`);
            if (nextInput) nextInput.focus();
        }
    }

    function removeTech(pi, ti) {
        projects[pi].technologies.splice(ti, 1);
        markDirty();
        render();
    }

    function addProject() {
        projects.push(normalize({}));
        markDirty();
        render();
        updateCounts();
        const cards = document.querySelectorAll('.project-card');
        const last = cards[cards.length - 1];
        if (last) {
            last.scrollIntoView({ behavior: 'smooth', block: 'center' });
            const nameInput = last.querySelector('.project-name');
            if (nameInput) setTimeout(() => nameInput.focus(), 200);
        }
    }

    function removeProject(i) {
        if (!confirm(`Delete "${projects[i].name || 'Untitled'}"?`)) return;
        projects.splice(i, 1);
        markDirty();
        render();
        updateCounts();
    }

    function moveProject(i, dir) {
        const j = i + dir;
        if (j < 0 || j >= projects.length) return;
        [projects[i], projects[j]] = [projects[j], projects[i]];
        markDirty();
        render();
    }

    function duplicateProject(i) {
        const copy = JSON.parse(JSON.stringify(projects[i]));
        copy.name += ' (copy)';
        projects.splice(i + 1, 0, copy);
        markDirty();
        render();
        updateCounts();
    }

    function triggerUpload(i) {
        uploadTarget = i;
        document.getElementById('global-upload').click();
    }

    async function handleUpload(e) {
        const file = e.target.files[0];
        if (!file || uploadTarget === null) return;
        const i = uploadTarget;
        uploadTarget = null;
        e.target.value = '';

        const form = new FormData();
        form.append('file', file);
        form.append('plugin', 'projects');
        form.append('field', 'image');

        try {
            const res = await fetch('/admin/api/upload', { method: 'POST', body: form });
            if (!res.ok) throw new Error(await res.text());
            const data = await res.json();
            projects[i].image = data.url;
            markDirty();
            render();
            toast('Image uploaded', 'success');
        } catch (err) {
            toast('Upload failed: ' + err.message, 'error');
        }
    }

    function initSortable() {
        new Sortable(document.getElementById('project-list'), {
            animation: 150,
            handle: '.drag-handle',
            ghostClass: 'sortable-ghost',
            onEnd(evt) {
                const item = projects.splice(evt.oldIndex, 1)[0];
                projects.splice(evt.newIndex, 0, item);
                markDirty();
                render();
            }
        });
    }

    function markDirty() {
        dirty = true;
        document.getElementById('status-text').textContent = 'Unsaved changes';
        document.getElementById('status-text').className = 'status-unsaved';
        updateCounts();
    }

    function markClean() {
        dirty = false;
        document.getElementById('status-text').textContent = 'All saved';
        document.getElementById('status-text').className = 'status-saved';
    }

    async function saveAll() {
        if (saving) return;
        saving = true;
        const btn = document.getElementById('save-btn');
        btn.textContent = 'Saving...';
        btn.disabled = true;
        document.getElementById('status-text').textContent = 'Saving...';
        document.getElementById('status-text').className = 'status-saving';

        try {
            const res = await fetch('/admin/api/projects', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(projects)
            });
            const data = await res.json();
            if (data.success) {
                markClean();
                toast('Saved ' + projects.length + ' projects', 'success');
            } else {
                toast('Save failed: ' + (data.error || 'unknown'), 'error');
            }
        } catch (err) {
            toast('Save failed: ' + err.message, 'error');
        } finally {
            saving = false;
            btn.textContent = 'Save';
            btn.disabled = false;
        }
    }

    function updateCounts() {
        document.getElementById('project-count').textContent = projects.length + ' projects';
        document.getElementById('status-count').textContent = projects.length + ' projects';
    }

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    }

    function toast(msg, type) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast toast-' + type + ' show';
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    function esc(s) {
        if (!s) return '';
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }
</script>
</body>
</html>
