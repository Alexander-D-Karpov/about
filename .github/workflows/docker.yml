name: Docker

on:
  push:
    branches: [ master, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create Dockerfile if not exists
      run: |
        if [ ! -f Dockerfile ]; then
          cat > Dockerfile << 'DOCKEREOF'
        # Build stage
        FROM golang:1.22-alpine AS builder

        # Install git and ca-certificates
        RUN apk add --no-cache git ca-certificates

        # Set working directory
        WORKDIR /app

        # Copy go mod files
        COPY go.mod go.sum ./

        # Download dependencies
        RUN go mod download

        # Copy source code
        COPY . .

        # Build the application
        RUN CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -o master .

        # Final stage
        FROM alpine:latest

        # Install ca-certificates for HTTPS requests
        RUN apk --no-cache add ca-certificates

        # Create non-root user
        RUN adduser -D -s /bin/sh appuser

        WORKDIR /root/

        # Copy the binary from builder stage
        COPY --from=builder /app/master .

        # Copy static files and templates
        COPY --from=builder /app/static ./static
        COPY --from=builder /app/templates ./templates

        # Create data directory
        RUN mkdir -p /app/data && chown appuser:appuser /app/data

        # Switch to non-root user
        USER appuser

        # Expose port
        EXPOSE 8080

        # Set environment variables
        ENV PORT=8080
        ENV DATA_PATH=/app/data

        # Run the application
        CMD ["./master"]
        DOCKEREOF
        fi

    - name: Build Docker image for testing
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        tags: test-image:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        # Run container in background
        docker run -d --name test-container -p 18080:8080 \
          -e PORT=8080 \
          -e DATA_PATH=/app/data \
          -e ADMIN_USER=testadmin \
          -e ADMIN_PASS=testpass123 \
          test-image:latest

        # Wait for container to start
        sleep 10

        # Test health endpoint
        max_attempts=30
        attempt=0
        while [ $attempt -lt $max_attempts ]; do
          if curl -f http://localhost:18080/health; then
            echo "Container is healthy!"
            break
          fi
          echo "Attempt $((attempt + 1))/$max_attempts: Container not ready yet..."
          sleep 2
          attempt=$((attempt + 1))
        done

        if [ $attempt -eq $max_attempts ]; then
          echo "Container failed to become healthy"
          docker logs test-container
          exit 1
        fi

        # Test status endpoint
        curl -f http://localhost:18080/status

        # Clean up
        docker stop test-container
        docker rm test-container

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha

    - name: Build and push Docker image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
