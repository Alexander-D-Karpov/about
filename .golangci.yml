version: "2"

# golangci-lint v2 config. The go.mod targets go 1.25, so CI must use a v2
# golangci-lint (v1.64.8 is built with go 1.24 and refuses go-1.25 modules).
# A focused, passing set; the separate `staticcheck` CI step covers deeper analysis.
run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - unconvert
    - whitespace
    - misspell

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
