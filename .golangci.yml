run:
  timeout: 5m

# golangci-lint v1 config (the CI action pins v1.64.8). A focused, passing set;
# the separate `staticcheck` CI step covers deeper analysis.
linters:
  disable-all: true
  enable:
    - govet
    - ineffassign
    - unconvert
    - whitespace
    - misspell
    - gofmt

linters-settings:
  gofmt:
    simplify: true

issues:
  exclude-dirs:
    - vendor
  exclude-files:
    - ".*\\.pb\\.go$"
